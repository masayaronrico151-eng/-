<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badminton 2024 Kanagawa Gakuen - Cute Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 25%, #e8eaf6 50%, #e0f7fa 75%, #fff9c4 100%);
    min-height: 100vh;
    font-family: 'M PLUS Rounded 1c', 'Nunito', sans-serif;
    padding: 40px 20px;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    color: #e91e63;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 rgba(233,30,99,0.1);
  }

  .subtitle {
    text-align: center;
    color: #9c27b0;
    font-size: 1rem;
    margin-bottom: 40px;
  }

  .comparison {
    text-align: center;
    max-width: 1200px;
    margin: 0 auto 40px;
  }

  .comparison h2 {
    font-size: 1.5rem;
    color: #7b1fa2;
    margin-bottom: 20px;
  }

  .tshirt-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .tshirt-card {
    background: white;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .tshirt-card::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: linear-gradient(45deg, #ff6b9d, #c084fc, #60a5fa, #34d399);
    border-radius: 26px;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .tshirt-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 16px 48px rgba(0,0,0,0.12);
  }

  .tshirt-card:hover::before {
    opacity: 1;
  }

  .tshirt-card h3 {
    text-align: center;
    margin-top: 12px;
    color: #6b7280;
    font-size: 0.9rem;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    animation: sparkle-float 3s ease-in-out infinite;
    font-size: 1.5rem;
    opacity: 0.6;
    z-index: 0;
  }

  @keyframes sparkle-float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
    50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .kawaii-eyes { animation: bounce 2s ease-in-out infinite; }
  .star-deco { animation: twinkle 1.5s ease-in-out infinite; }
  .star-deco:nth-child(2) { animation-delay: 0.5s; }
  .star-deco:nth-child(3) { animation-delay: 1s; }

  .heart-float {
    animation: heart-up 3s ease-in-out infinite;
  }

  @keyframes heart-up {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-8px) scale(1.1); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 0.7; }
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    color: #9ca3af;
    font-size: 0.85rem;
  }
</style>
</head>
